org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# No org.gradle.java.home here on purpose: it is machine-specific. Gradle uses
# JAVA_HOME, and Android Studio supplies its own JDK. If you need to pin one,
# put it in ~/.gradle/gradle.properties rather than in the repo.
